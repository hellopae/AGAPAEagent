<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGAPAE — Routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --paper-2:#FCFBF8; --ink:#1B1C20; --ink-soft:#56565E; --ink-faint:#97969C;
    --line:#E5E2DB; --line-strong:#D2CEC4; --accent:#2A3344; --gold:#9A7B4F;
    --done:#5E7A66; --card:#FFFFFF;
    --shadow:0 1px 2px rgba(27,28,32,.04),0 10px 30px rgba(27,28,32,.07);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Space Grotesk","Noto Sans Thai",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased; padding:0 0 64px;
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  .wrap{max-width:860px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid var(--line);background:var(--paper-2)}
  .head-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 24px}
  .brand{display:flex;gap:14px;align-items:center}
  .press-mark{width:44px;height:44px;border-radius:10px;object-fit:cover}
  h1{font-size:19px;font-weight:700}
  .sub{font-size:11px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase}
  .back{font-size:13px;color:var(--gold);text-decoration:none}
  .back:hover{text-decoration:underline}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--paper-2)}
  .tabs .wrap{display:flex}
  .tab{
    appearance:none;border:none;background:none;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-faint);
    padding:13px 22px;border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--gold)}
  .panel{display:none;padding-top:28px}
  .panel.active{display:block}
  .r-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:24px 28px;
  }
  .r-date{font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
  .r-title{font-size:18px;font-weight:700;margin-bottom:14px}
  .r-items{list-style:none}
  .r-items li{
    padding:10px 0 10px 22px;position:relative;font-size:14.5px;color:var(--ink-soft);
    border-bottom:1px solid var(--line);
  }
  .r-items li:last-child{border-bottom:none}
  .r-items li::before{content:"▸";position:absolute;left:2px;color:var(--gold);font-size:12px}
  .r-stamp{margin-top:14px;font-size:11px;color:var(--ink-faint)}
  .empty{color:var(--ink-faint);font-size:14px;padding:8px 0}
  details.r-full{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  details.r-full summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--gold)}
  details.r-full pre{
    white-space:pre-wrap;font-family:inherit;font-size:13.5px;color:var(--ink-soft);
    margin-top:10px;line-height:1.7;
  }
  .sv-head{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
  .sv-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
  .sv-title{font-size:19px;font-weight:700}
  .sv-meta{font-size:12px;color:var(--ink-faint);margin-top:4px}
  .sv-status{flex:0 0 auto;border:1px solid var(--line-strong);border-radius:999px;padding:6px 11px;font-size:11px;color:var(--ink-soft);background:var(--paper-2)}
  .sv-flow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
  .sv-step{font-size:11px;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
  .sv-step.active{color:var(--ink);border-color:var(--gold);background:var(--paper-2)}
  .sv-section{font-size:13px;font-weight:700;margin:20px 0 10px}
  .sv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sv-idea{display:block;border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--paper-2);cursor:pointer}
  .sv-idea:has(input:checked){border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .sv-idea input{margin-right:8px;accent-color:var(--gold)}
  .sv-idea-title{font-size:14px;font-weight:600}
  .sv-idea-hook{font-size:12.5px;color:var(--ink-soft);margin:7px 0 0 24px;line-height:1.65}
  .sv-idea details{margin:9px 0 0 24px}
  .sv-idea summary{font-size:12px;color:var(--gold);cursor:pointer}
  .sv-idea pre{white-space:pre-wrap;font:inherit;font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.7}
  .sv-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
  .sv-button{appearance:none;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:var(--paper-2);font:600 12px inherit;padding:8px 12px;cursor:pointer}
  .sv-button{text-decoration:none;display:inline-block}
  .sv-button:disabled{opacity:.45;cursor:not-allowed}
  .sv-choice-note{font-size:12px;color:var(--ink-faint)}
  .sv-production{display:grid;gap:8px}
  .sv-job{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}
  .sv-job:first-child{border-top:none}
  .sv-job-title{font-size:13.5px;color:var(--ink-soft)}
  .sv-empty{font-size:13px;color:var(--ink-faint);padding:8px 0}
  @media(max-width:640px){
    .tabs{overflow-x:auto}.tabs .wrap{min-width:max-content}.tab{padding-inline:15px}
    .sv-grid{grid-template-columns:1fr}.sv-head{display:block}.sv-status{display:inline-block;margin-top:10px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap head-inner">
    <div class="brand">
      <img class="press-mark" src="avatars/Logo-Agapae.jpg" alt="AGAPAE">
      <div>
        <h1>Routines</h1>
        <div class="sub mono">Daily · Weekly · Monthly · Tora & the Gangz</div>
      </div>
    </div>
    <a class="back" href="index.html">← Team Console</a>
  </div>
</header>

<div class="tabs">
  <div class="wrap">
    <button class="tab active" data-t="daily" onclick="switchTab('daily')">Daily</button>
    <button class="tab" data-t="weekly" onclick="switchTab('weekly')">Weekly</button>
    <button class="tab" data-t="monthly" onclick="switchTab('monthly')">Monthly</button>
    <button class="tab" data-t="science" onclick="switchTab('science')">Tora & the Gangz</button>
  </div>
</div>

<div class="wrap">
  <div class="panel active" id="p-daily"><div class="r-card" id="c-daily"><div class="empty">กำลังโหลด…</div></div></div>
  <div class="panel" id="p-weekly"><div class="r-card" id="c-weekly"><div class="empty">กำลังโหลด…</div></div></div>
  <div class="panel" id="p-monthly"><div class="r-card" id="c-monthly"><div class="empty">กำลังโหลด…</div></div></div>
  <div class="panel" id="p-science"><div class="r-card" id="c-science"><div class="empty">กำลังโหลด…</div></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCtIZVYmibm4Rwb878iEdnxHjvpVcLfs2E",
  authDomain:"agapae-studio.firebaseapp.com",
  projectId:"agapae-studio",
  storageBucket:"agapae-studio.firebasestorage.app",
  messagingSenderId:"647606526363",
  appId:"1:647606526363:web:6d0bcd10ef5451aca6c13e"
});

function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+t));
}

const EMPTY_TEXT = {
  daily:  "ยังไม่มีสรุปข่าววันนี้ — Daily routine เขียนทุก 09:00",
  weekly: "ยังไม่มีสรุปประจำสัปดาห์ — Weekly routine จะเริ่มเขียนเร็ว ๆ นี้",
  monthly:"ยังไม่มีสรุปประจำเดือน — Monthly routine จะเริ่มเขียนเร็ว ๆ นี้",
  science:"ยังไม่มีชุดหัวข้อ Science Video — Claude เริ่มทุกเสาร์ 08:00 และ ChatGPT ตรวจสำรอง 08:15",
};

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function render(kind, d){
  const box = document.getElementById('c-'+kind);
  if(!d || !Array.isArray(d.items) || !d.items.length){
    box.innerHTML = `<div class="empty">${EMPTY_TEXT[kind]}</div>`;
    return;
  }
  box.innerHTML = `
    ${d.date ? `<div class="r-date mono">${esc(d.date)}</div>` : ""}
    <div class="r-title">${esc(d.title || "สรุป")}</div>
    <ul class="r-items">${d.items.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    ${d.full ? `<details class="r-full"><summary>อ่านฉบับเต็ม</summary><pre>${esc(d.full)}</pre></details>` : ""}
    ${d.updatedAt ? `<div class="r-stamp mono">อัปเดต ${new Date(d.updatedAt).toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"})}</div>` : ""}`;
}

const SV_LABELS = {
  awaiting_ideas:"รอสร้างหัวข้อ", ideas_ready:"มี 10 หัวข้อแล้ว", selected:"เลือก 3 หัวข้อแล้ว",
  voice_ready:"เสียงพร้อม", video_ready:"วิดีโอพร้อม", review:"รอตรวจ", approved:"อนุมัติแล้ว",
  scheduled:"ตั้งเวลาแล้ว", published:"เผยแพร่แล้ว", blocked:"ต้องดำเนินการ",
};
const SV_FLOW = ["ideas_ready","selected","voice_ready","video_ready","review","approved","scheduled","published"];
let scienceCurrent = null;

function sciencePayload(d){
  if(!d) return null;
  if(typeof d.dataJson === "string"){
    try{return JSON.parse(d.dataJson)}catch(err){console.warn("science_video dataJson",err)}
  }
  return d;
}
function renderScience(input){
  const d=sciencePayload(input);
  scienceCurrent=d;
  const box=document.getElementById("c-science");
  if(!d||!Array.isArray(d.items)||!d.week){box.innerHTML='<div class="empty">ยังไม่มีชุดบท Tora & the Gangz</div>';return}
  const active=Array.isArray(d.production)?d.production.filter(job=>job.status!=="published"):[];
  const published=Array.isArray(d.production)?d.production.filter(job=>job.status==="published"):[];
  box.innerHTML='<div class="sv-head"><div><div class="sv-kicker mono">'+esc(d.week)+' · '+esc(d.source||"Claude")+'</div><div class="sv-title">Tora & the Gangz — Story Pipeline</div><div class="sv-meta">10 บท → เลือก 3 พร้อมคอมเมนต์ → ทำ Animation → YouTube</div></div></div>'+
    '<div class="sv-section">บทที่เสนอ '+d.items.length+' เรื่อง · กำลังผลิต '+active.length+' · เผยแพร่แล้ว '+published.length+'</div>'+
    '<div class="sv-grid">'+d.items.map((item,i)=>'<div class="sv-idea"><div class="sv-idea-title">'+(i+1)+'. '+esc(item.title||"ยังไม่มีชื่อ")+'</div>'+ (item.hook?'<div class="sv-idea-hook">'+esc(item.hook)+'</div>':'')+'</div>').join('')+'</div>'+
    '<div class="sv-actions"><a class="sv-button" href="index.html#science">เปิดหน้าเลือกบทและติดตามงาน ↗</a></div>';
}

for(const kind of ["daily","weekly","monthly"]){
  firebase.firestore().collection("agents").doc(kind).onSnapshot(
    d=>render(kind, d.exists ? d.data() : null),
    err=>{console.warn("Firestore",kind,err); render(kind,null);}
  );
}

fetch("science-video.json").then(r=>r.ok?r.json():null).then(d=>{if(d?.week)renderScience(d)}).catch(()=>{});
firebase.firestore().collection("agents").doc("science_video").onSnapshot(
  d=>renderScience(d.exists ? d.data() : null),
  err=>{console.warn("Firestore science_video",err);if(!scienceCurrent)renderScience(null);}
);
const initialTab = location.hash.slice(1);
if(["daily","weekly","monthly","science"].includes(initialTab)) switchTab(initialTab);
</script>
</body>
</html>
