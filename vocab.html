<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGAPAE — Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --paper-2:#FCFBF8; --ink:#1B1C20; --ink-soft:#56565E; --ink-faint:#97969C;
    --line:#E5E2DB; --line-strong:#D2CEC4; --accent:#2A3344; --gold:#9A7B4F;
    --done:#5E7A66; --bad:#A85B4C; --card:#FFFFFF;
    --shadow:0 1px 2px rgba(27,28,32,.04),0 10px 30px rgba(27,28,32,.07);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Space Grotesk","Noto Sans Thai",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased; padding:0 0 80px;
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid var(--line);background:var(--paper-2)}
  .head-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;gap:16px}
  .brand{display:flex;gap:14px;align-items:center}
  .press-mark{width:44px;height:44px;border-radius:10px;object-fit:cover}
  h1{font-size:19px;font-weight:700}
  .sub{font-size:11px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase}
  .back{font-size:13px;color:var(--gold);text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}
  .tabs{border-bottom:1px solid var(--line);background:var(--paper-2);overflow-x:auto}
  .tabs .wrap{display:flex;padding:0 24px}
  .tab{
    appearance:none;border:none;background:none;cursor:pointer;white-space:nowrap;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-faint);
    padding:13px 20px;border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--gold)}
  .panel{display:none;padding-top:26px}
  .panel.active{display:block}

  /* ---------- shared bits ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .btn{
    appearance:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    padding:10px 18px;border-radius:10px;border:1px solid var(--line-strong);
    background:var(--card);color:var(--ink);transition:.15s;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#1d2534;color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .muted{color:var(--ink-faint);font-size:13px}
  .sec-title{font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}

  /* ---------- browse ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{
    flex:1;min-width:220px;font-family:inherit;font-size:14.5px;
    padding:11px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--card);color:var(--ink);
  }
  .search:focus{outline:none;border-color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
  .chip{
    appearance:none;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    padding:6px 12px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--card);color:var(--ink-soft);
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.55;font-weight:500;margin-left:4px}
  .list{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
  .row{padding:15px 20px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
  .w{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .t{font-size:14.5px;color:var(--ink-soft)}
  .cat{
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    color:var(--gold);border:1px solid var(--line-strong);border-radius:6px;padding:2px 7px;margin-left:auto;
  }
  .ex{margin-top:8px;font-size:13.5px;color:var(--ink-soft);padding-left:12px;border-left:2px solid var(--line-strong)}
  .ex .en{color:var(--ink)}
  .note{margin-top:8px;font-size:12.5px;color:var(--gold);background:rgba(154,123,79,.07);border-radius:8px;padding:7px 10px}
  .mine{font-size:10.5px;color:var(--done);border:1px solid var(--done);border-radius:6px;padding:1px 6px;letter-spacing:.06em}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:14px}

  /* ---------- daily ---------- */
  .day-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .streak{font-size:13px;color:var(--ink-soft)}
  .streak b{color:var(--gold)}
  .flash{padding:20px 22px;margin-bottom:12px;cursor:pointer}
  .flash .w{font-size:22px}
  .flash .hint{font-size:12px;color:var(--ink-faint);margin-top:6px}
  .flash .body{display:none;margin-top:12px}
  .flash.open .body{display:block}
  .flash.open .hint{display:none}
  .flash.known{border-color:var(--done)}
  .flash-actions{display:flex;gap:8px;margin-top:14px}

  /* ---------- quiz ---------- */
  .quiz-setup{padding:24px;text-align:center}
  .quiz-setup .sel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
  .qbox{padding:26px 24px}
  .qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-faint);margin-bottom:16px}
  .qprompt{font-size:24px;font-weight:700;text-align:center;margin:10px 0 6px;line-height:1.35}
  .qsub{text-align:center;font-size:13px;color:var(--ink-faint);margin-bottom:22px}
  .opts{display:grid;gap:9px}
  .opt{
    appearance:none;font-family:inherit;font-size:15px;text-align:left;cursor:pointer;
    padding:13px 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink);
  }
  .opt:hover:not(:disabled){border-color:var(--gold)}
  .opt.right{border-color:var(--done);background:rgba(94,122,102,.1);color:var(--done);font-weight:600}
  .opt.wrong{border-color:var(--bad);background:rgba(168,91,76,.09);color:var(--bad)}
  .opt:disabled{cursor:default}
  .qafter{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);display:none}
  .qafter.show{display:block}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;background:var(--gold);transition:.25s}
  .result{padding:36px 24px;text-align:center}
  .result .big{font-size:44px;font-weight:700;letter-spacing:-.02em}
  .result .lbl{font-size:13px;color:var(--ink-faint);margin-bottom:18px}

  /* ---------- add ---------- */
  .form{padding:24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;font-family:inherit;font-size:14.5px;padding:11px 13px;
    border:1px solid var(--line-strong);border-radius:10px;background:var(--paper-2);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:64px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:var(--card)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .save-row{display:flex;gap:10px;align-items:center;margin-top:6px}
  .flash-msg{font-size:13px;color:var(--done)}
  .flash-msg.err{color:var(--bad)}
  .del{
    appearance:none;border:none;background:none;cursor:pointer;color:var(--ink-faint);
    font-family:inherit;font-size:12px;text-decoration:underline;padding:0;margin-top:8px;
  }
  .del:hover{color:var(--bad)}
  @media(max-width:620px){
    .two{grid-template-columns:1fr}
    .wrap{padding:0 16px}
    .tabs .wrap{padding:0 16px}
    .head-inner{padding:16px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap head-inner">
    <div class="brand">
      <img class="press-mark" src="avatars/Logo-Agapae.jpg" alt="AGAPAE">
      <div>
        <h1>Vocabulary</h1>
        <div class="sub mono">คลังคำศัพท์ · 5 คำวันนี้ · เกมทายคำ</div>
      </div>
    </div>
    <a class="back" href="index.html">← Team Console</a>
  </div>
</header>

<nav class="tabs">
  <div class="wrap">
    <button class="tab active" data-p="browse">คลังคำศัพท์</button>
    <button class="tab" data-p="daily">5 คำวันนี้</button>
    <button class="tab" data-p="quiz">เกมทายคำ</button>
    <button class="tab" data-p="add">เพิ่มคำใหม่</button>
  </div>
</nav>

<main class="wrap">

  <!-- ============ BROWSE ============ -->
  <section class="panel active" id="p-browse">
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="ค้นหา… พิมพ์ได้ทั้งอังกฤษและไทย">
      <button class="btn" id="shuffle">สุ่มลำดับ</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="muted" id="count" style="margin-bottom:10px"></div>
    <div class="list" id="list"><div class="empty">กำลังโหลด…</div></div>
  </section>

  <!-- ============ DAILY ============ -->
  <section class="panel" id="p-daily">
    <div class="day-head">
      <div>
        <div class="sec-title">คำศัพท์ประจำวัน</div>
        <div class="muted mono" id="today"></div>
      </div>
      <div class="streak" id="streak"></div>
    </div>
    <div id="cards"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
      <button class="btn" id="reroll">สุ่มชุดใหม่</button>
      <button class="btn primary" id="quizToday">ทดสอบ 5 คำนี้</button>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section class="panel" id="p-quiz">
    <div class="card" id="quizArea"></div>
  </section>

  <!-- ============ ADD ============ -->
  <section class="panel" id="p-add">
    <div class="card form">
      <div class="sec-title">เพิ่มคำศัพท์ใหม่</div>
      <div class="two">
        <div class="field">
          <label>คำศัพท์ (อังกฤษ)</label>
          <input id="f-w" placeholder="เช่น resilient">
        </div>
        <div class="field">
          <label>ความหมาย (ไทย)</label>
          <input id="f-t" placeholder="เช่น ยืดหยุ่น ฟื้นตัวเก่ง">
        </div>
      </div>
      <div class="field">
        <label>หมวดหมู่</label>
        <select id="f-c"></select>
      </div>
      <div class="field">
        <label>ตัวอย่างประโยค (อังกฤษ)</label>
        <input id="f-e" placeholder="She's remarkably resilient.">
      </div>
      <div class="field">
        <label>คำแปลประโยค (ไทย) — ใส่หรือไม่ใส่ก็ได้</label>
        <input id="f-x" placeholder="เธอฟื้นตัวเก่งมาก">
      </div>
      <div class="field">
        <label>โน้ตเพิ่มเติม — ใส่หรือไม่ใส่ก็ได้</label>
        <textarea id="f-n" placeholder="เจอจากซีรีส์เรื่องอะไร / คำใกล้เคียง / จุดที่มักสับสน"></textarea>
      </div>
      <div class="save-row">
        <button class="btn primary" id="save">บันทึกคำศัพท์</button>
        <span class="flash-msg" id="msg"></span>
      </div>
    </div>

    <div style="margin-top:24px">
      <div class="sec-title">คำที่เพิ่มเอง (<span id="myCount">0</span>)</div>
      <div class="list" id="myList"><div class="empty">ยังไม่มีคำที่เพิ่มเอง</div></div>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ══════════════ config ══════════════ */
const CATS = {
  emo:"อารมณ์ ความรู้สึก",
  ppl:"คน นิสัย บุคลิก",
  act:"กริยา การกระทำ",
  des:"คำบรรยาย คุณศัพท์",
  soc:"สังคม การเมือง กฎหมาย",
  rel:"ศาสนา ความเชื่อ พิธีกรรม",
  fan:"แฟนตาซี สงคราม ยุคกลาง",
  day:"ของใช้ อาหาร ชีวิตประจำวัน",
  lng:"ภาษา สื่อ วรรณกรรม",
  phr:"Phrasal verbs",
  sla:"สแลง สำนวน",
  sen:"ประโยคใช้จริง",
  gra:"ไวยากรณ์ คำที่สับสน"
};
const CAT_KEYS = Object.keys(CATS);

firebase.initializeApp({
  apiKey:"AIzaSyCtIZVYmibm4Rwb878iEdnxHjvpVcLfs2E",
  authDomain:"agapae-studio.firebaseapp.com",
  projectId:"agapae-studio",
  storageBucket:"agapae-studio.firebasestorage.app"
});
const DOC = firebase.firestore().collection("agents").doc("vocab");

/* ══════════════ state ══════════════ */
let BASE = [];      // จาก vocab.json
let MINE = [];      // เพิ่มเอง (Firestore + localStorage)
let VIEW = [];      // ที่แสดงอยู่ตอนนี้
let cat = "all", shuffled = false;

const ALL = () => BASE.concat(MINE);
const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayKey = () => new Date().toLocaleDateString("sv-SE"); // YYYY-MM-DD (เวลาเครื่อง)

/* ══════════════ tabs ══════════════ */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("p-"+t.dataset.p).classList.add("active");
  if(t.dataset.p==="quiz" && !quiz.running) renderQuizSetup();
});

/* ══════════════ load ══════════════ */
async function boot(){
  try{
    const r = await fetch("vocab.json?t="+Date.now());
    const j = await r.json();
    BASE = j.words || [];
  }catch(e){
    document.getElementById("list").innerHTML = '<div class="empty">โหลด vocab.json ไม่สำเร็จ</div>';
  }
  MINE = LS.get("vocab_mine", []);
  buildChips(); buildCatSelect(); renderList(); renderDaily(); renderMine();

  // ซิงก์ข้ามเครื่องผ่าน Firestore — custom = คำที่เพิ่มเอง · known = คำที่จำได้แล้ว
  // (widget บน Mac อ่าน/เขียน doc เดียวกัน จึงสุ่ม "5 คำวันนี้" ได้ชุดเดียวกันเสมอ)
  DOC.onSnapshot(d=>{
    const data = d.exists ? d.data() : {};
    const remote = data.custom || [];
    if(Array.isArray(remote)){
      const map = new Map();
      remote.concat(MINE).forEach(w=>{ if(w && w.w) map.set(w.w.toLowerCase(), w) });
      MINE = [...map.values()];
      LS.set("vocab_mine", MINE);
      buildChips(); renderList(); renderMine();
    }
    if(Array.isArray(data.known)){
      const merged = [...new Set(LS.get("vocab_known",[]).concat(data.known))];
      LS.set("vocab_known", merged);
      renderDaily();
    }
  }, ()=>{});
}
boot();

/* ══════════════ browse ══════════════ */
function buildChips(){
  const counts = {}; ALL().forEach(w=>counts[w.c]=(counts[w.c]||0)+1);
  const el = document.getElementById("chips");
  el.innerHTML = `<button class="chip ${cat==="all"?"active":""}" data-c="all">ทั้งหมด<span class="n">${ALL().length}</span></button>` +
    CAT_KEYS.filter(k=>counts[k]).map(k=>
      `<button class="chip ${cat===k?"active":""}" data-c="${k}">${CATS[k]}<span class="n">${counts[k]}</span></button>`
    ).join("");
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ cat=c.dataset.c; buildChips(); renderList(); });
}

function match(w,q){
  if(!q) return true;
  q = q.toLowerCase();
  return (w.w+" "+w.t+" "+(w.e||"")+" "+(w.x||"")+" "+(w.n||"")).toLowerCase().includes(q);
}

function renderList(){
  const q = document.getElementById("q").value.trim();
  let rows = ALL().filter(w=>(cat==="all"||w.c===cat) && match(w,q));
  if(shuffled) rows = shuffle(rows.slice());
  VIEW = rows;
  document.getElementById("count").textContent = `${rows.length} คำ`;
  const box = document.getElementById("list");
  if(!rows.length){ box.innerHTML = '<div class="empty">ไม่พบคำที่ค้นหา</div>'; return; }
  box.innerHTML = rows.slice(0,400).map(cardRow).join("") +
    (rows.length>400 ? `<div class="empty">แสดง 400 คำแรก — พิมพ์ค้นหาเพื่อกรองให้แคบลง</div>` : "");
}
function cardRow(w, extra=""){
  return `<div class="row">
    <div class="row-head">
      <span class="w">${esc(w.w)}</span>
      <span class="t">${esc(w.t)}</span>
      ${w.mine?'<span class="mine">เพิ่มเอง</span>':""}
      <span class="cat">${esc(CATS[w.c]||w.c)}</span>
    </div>
    ${w.e?`<div class="ex"><div class="en">${esc(w.e)}</div>${w.x?`<div>${esc(w.x)}</div>`:""}</div>`:""}
    ${w.n?`<div class="note">${esc(w.n)}</div>`:""}
    ${extra}
  </div>`;
}
document.getElementById("q").oninput = renderList;
document.getElementById("shuffle").onclick = ()=>{ shuffled = !shuffled; renderList(); };

/* ══════════════ daily 5 ══════════════ */
function seedRandom(seed){ // LCG — ให้ผลเหมือนเดิมทุกครั้งในวันเดียวกัน
  let s = seed % 2147483647; if(s<=0) s += 2147483646;
  return ()=> (s = s*16807 % 2147483647) / 2147483647;
}
function shuffle(a, rnd=Math.random){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]] }
  return a;
}
function pickDaily(n=5){
  const pool = ALL();
  if(!pool.length) return [];
  const known = new Set(LS.get("vocab_known",[]));
  const fresh = pool.filter(w=>!known.has(w.w.toLowerCase()));
  const src = fresh.length>=n ? fresh : pool;
  const day = todayKey();
  const bump = LS.get("vocab_reroll_"+day, 0);
  const seed = Number(day.replace(/-/g,"")) + bump*7919;
  const rnd = seedRandom(seed);
  return shuffle(src.slice(), rnd).slice(0,n);
}
let DAILY = [];
function renderDaily(){
  DAILY = pickDaily(5);
  document.getElementById("today").textContent = todayKey();
  const done = LS.get("vocab_done_"+todayKey(), []);
  const box = document.getElementById("cards");
  if(!DAILY.length){ box.innerHTML = '<div class="empty">ยังไม่มีคำศัพท์</div>'; return; }
  box.innerHTML = DAILY.map((w,i)=>`
    <div class="card flash ${done.includes(w.w)?"known":""}" data-i="${i}">
      <div class="row-head">
        <span class="w">${esc(w.w)}</span>
        <span class="cat">${esc(CATS[w.c]||w.c)}</span>
      </div>
      <div class="hint">แตะเพื่อดูความหมาย</div>
      <div class="body">
        <div class="t" style="font-size:16px">${esc(w.t)}</div>
        ${w.e?`<div class="ex"><div class="en">${esc(w.e)}</div>${w.x?`<div>${esc(w.x)}</div>`:""}</div>`:""}
        ${w.n?`<div class="note">${esc(w.n)}</div>`:""}
        <div class="flash-actions">
          <button class="btn" data-known="${esc(w.w)}">${done.includes(w.w)?"✓ จำได้แล้ว":"จำได้แล้ว"}</button>
        </div>
      </div>
    </div>`).join("");
  box.querySelectorAll(".flash").forEach(c=>c.onclick=e=>{
    if(e.target.dataset.known!==undefined) return;
    c.classList.toggle("open");
  });
  box.querySelectorAll("[data-known]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const word = b.dataset.known;
    const key = "vocab_done_"+todayKey();
    const list = LS.get(key,[]);
    const known = LS.get("vocab_known",[]);
    if(!list.includes(word)){
      list.push(word); LS.set(key,list);
      if(!known.includes(word.toLowerCase())){
        known.push(word.toLowerCase()); LS.set("vocab_known",known);
        DOC.set({ known: firebase.firestore.FieldValue.arrayUnion(word.toLowerCase()) }, { merge:true }).catch(()=>{});
      }
    }
    renderDaily();
  });
  renderStreak();
}
function renderStreak(){
  const done = LS.get("vocab_done_"+todayKey(), []).length;
  const known = LS.get("vocab_known",[]).length;
  document.getElementById("streak").innerHTML =
    `วันนี้ท่องแล้ว <b>${done}/${DAILY.length}</b> · จำได้สะสม <b>${known}</b> คำ`;
}
document.getElementById("reroll").onclick = ()=>{
  const k = "vocab_reroll_"+todayKey();
  LS.set(k, LS.get(k,0)+1);
  renderDaily();
};
document.getElementById("quizToday").onclick = ()=>{
  document.querySelector('.tab[data-p="quiz"]').click();
  startQuiz(DAILY.slice(), "th2en");
};

/* ══════════════ quiz ══════════════ */
const quiz = { running:false, qs:[], i:0, score:0, dir:"th2en" };

function renderQuizSetup(){
  const counts = {}; ALL().forEach(w=>counts[w.c]=(counts[w.c]||0)+1);
  document.getElementById("quizArea").innerHTML = `
    <div class="quiz-setup">
      <div class="sec-title">เกมทายคำศัพท์</div>
      <p class="muted">10 ข้อต่อรอบ เลือกคำตอบที่ถูก แล้วดูคะแนนตอนจบ</p>
      <div class="sel">
        <select class="search" id="qcat" style="max-width:260px;flex:none">
          <option value="all">ทุกหมวด (${ALL().length} คำ)</option>
          ${CAT_KEYS.filter(k=>counts[k]>=4).map(k=>`<option value="${k}">${CATS[k]} (${counts[k]})</option>`).join("")}
        </select>
        <select class="search" id="qdir" style="max-width:260px;flex:none">
          <option value="th2en">เห็นคำแปลไทย → ทายคำอังกฤษ</option>
          <option value="en2th">เห็นคำอังกฤษ → ทายคำแปลไทย</option>
        </select>
      </div>
      <button class="btn primary" id="startQ">เริ่มเล่น</button>
    </div>`;
  document.getElementById("startQ").onclick = ()=>{
    const c = document.getElementById("qcat").value;
    const dir = document.getElementById("qdir").value;
    const pool = ALL().filter(w=>c==="all"||w.c===c);
    startQuiz(shuffle(pool.slice()).slice(0,10), dir);
  };
}

function startQuiz(words, dir){
  if(words.length<4){ renderQuizSetup(); return; }
  quiz.running = true; quiz.dir = dir; quiz.i = 0; quiz.score = 0;
  quiz.qs = words.map(w=>{
    const distractors = shuffle(ALL().filter(o=>o.w!==w.w && o.c===w.c))
      .slice(0,3);
    while(distractors.length<3){
      const r = ALL()[Math.floor(Math.random()*ALL().length)];
      if(r.w!==w.w && !distractors.find(d=>d.w===r.w)) distractors.push(r);
    }
    return { w, opts: shuffle([w, ...distractors]) };
  });
  renderQuestion();
}

function renderQuestion(){
  const q = quiz.qs[quiz.i];
  if(!q) return renderResult();
  const th2en = quiz.dir==="th2en";
  const label = o => th2en ? o.w : o.t;
  document.getElementById("quizArea").innerHTML = `
    <div class="qbox">
      <div class="bar"><i style="width:${(quiz.i/quiz.qs.length)*100}%"></i></div>
      <div class="qmeta"><span>ข้อ ${quiz.i+1} / ${quiz.qs.length}</span><span>คะแนน ${quiz.score}</span></div>
      <div class="qprompt">${esc(th2en ? q.w.t : q.w.w)}</div>
      <div class="qsub">${th2en ? "คำนี้ภาษาอังกฤษว่าอะไร" : "คำนี้แปลว่าอะไร"}</div>
      <div class="opts" id="opts">
        ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(label(o))}</button>`).join("")}
      </div>
      <div class="qafter" id="qafter"></div>
    </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));
}

function answer(idx){
  const q = quiz.qs[quiz.i];
  const chosen = q.opts[idx];
  const correct = chosen.w === q.w.w;
  if(correct) quiz.score++;
  document.querySelectorAll("#opts .opt").forEach((b,i)=>{
    b.disabled = true;
    if(q.opts[i].w === q.w.w) b.classList.add("right");
    else if(i===idx) b.classList.add("wrong");
  });
  const a = document.getElementById("qafter");
  a.className = "qafter show";
  a.innerHTML = `
    <div><b>${esc(q.w.w)}</b> — ${esc(q.w.t)}</div>
    ${q.w.e?`<div class="ex" style="margin-top:8px"><div class="en">${esc(q.w.e)}</div>${q.w.x?`<div>${esc(q.w.x)}</div>`:""}</div>`:""}
    <div style="margin-top:14px"><button class="btn primary" id="next">${quiz.i+1<quiz.qs.length?"ข้อถัดไป":"ดูผล"}</button></div>`;
  document.getElementById("next").onclick = ()=>{ quiz.i++; renderQuestion(); };
}

function renderResult(){
  quiz.running = false;
  const pct = Math.round(quiz.score/quiz.qs.length*100);
  const msg = pct>=90?"แม่นมาก 🔥":pct>=70?"ดีแล้ว ไปต่อได้":pct>=50?"พอใช้ ทวนอีกรอบ":"ทวนคลังคำก่อนนะ";
  document.getElementById("quizArea").innerHTML = `
    <div class="result">
      <div class="big">${quiz.score}<span style="font-size:20px;color:var(--ink-faint)">/${quiz.qs.length}</span></div>
      <div class="lbl">${msg}</div>
      <button class="btn primary" id="again">เล่นอีกรอบ</button>
    </div>`;
  document.getElementById("again").onclick = renderQuizSetup;
}

/* ══════════════ add word ══════════════ */
function buildCatSelect(){
  document.getElementById("f-c").innerHTML =
    CAT_KEYS.map(k=>`<option value="${k}">${CATS[k]}</option>`).join("");
}

document.getElementById("save").onclick = async ()=>{
  const g = id => document.getElementById(id).value.trim();
  const msg = document.getElementById("msg");
  const w = g("f-w"), t = g("f-t");
  if(!w || !t){ msg.className="flash-msg err"; msg.textContent="ต้องใส่ทั้งคำศัพท์และความหมาย"; return; }
  if(ALL().find(x=>x.w.toLowerCase()===w.toLowerCase())){
    msg.className="flash-msg err"; msg.textContent="มีคำนี้ในคลังแล้ว"; return;
  }
  const entry = { w, t, c:g("f-c"), e:g("f-e"), x:g("f-x"), n:g("f-n"), mine:true, at:todayKey() };
  Object.keys(entry).forEach(k=>{ if(entry[k]==="") delete entry[k] });

  MINE.push(entry); LS.set("vocab_mine", MINE);
  buildChips(); renderList(); renderMine();
  ["f-w","f-t","f-e","f-x","f-n"].forEach(id=>document.getElementById(id).value="");
  msg.className="flash-msg"; msg.textContent="บันทึกแล้ว · กำลังซิงก์…";

  try{
    await DOC.set({ custom: firebase.firestore.FieldValue.arrayUnion(entry) }, { merge:true });
    msg.textContent = "บันทึกแล้ว ✓ ซิงก์ขึ้นคลาวด์เรียบร้อย";
  }catch(e){
    msg.textContent = "บันทึกในเครื่องแล้ว (ซิงก์คลาวด์ไม่สำเร็จ)";
  }
};

function renderMine(){
  document.getElementById("myCount").textContent = MINE.length;
  const box = document.getElementById("myList");
  if(!MINE.length){ box.innerHTML = '<div class="empty">ยังไม่มีคำที่เพิ่มเอง</div>'; return; }
  box.innerHTML = MINE.slice().reverse().map(w=>
    cardRow(w, `<button class="del" data-del="${esc(w.w)}">ลบคำนี้</button>`)
  ).join("");
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async ()=>{
    const word = b.dataset.del;
    const entry = MINE.find(x=>x.w===word);
    MINE = MINE.filter(x=>x.w!==word);
    LS.set("vocab_mine", MINE);
    buildChips(); renderList(); renderMine();
    if(entry){ try{ await DOC.set({ custom: firebase.firestore.FieldValue.arrayRemove(entry) }, { merge:true }) }catch(e){} }
  });
}
</script>
