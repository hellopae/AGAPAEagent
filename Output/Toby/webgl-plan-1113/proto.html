<!doctype html><meta charset="utf-8"><title>AVEGEE render A/B (scratch, not game code)</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas><canvas id="top" style="position:absolute;left:0;top:0;pointer-events:none;display:none"></canvas>
<script type="module">
// Scratch prototype for the WebGL plan (13 Nov 2026).  Same pixel budget the real map frame was measured at (anatomy.py, 1792x958 @2x):
//   ground 8 tiles (1x screen) + glow 'screen' (1x) + cloud-shadow layer (1x) + ~64 shadows (0.5x) + ~49 lights (0.3x) + ~110 sprites (0.45x) + liquid layer (0.55x)
// modes: hybrid = WebGL2 ground stack (ground+glow merged, shadows, liquid, lights) UNDER a transparent Canvas 2D that keeps sprites + the cloud-shadow layer
// modes: 2d = Canvas 2D like today · gl-naive = WebGL2, one quad per old 2D draw (same overdraw) · gl-merged = ground + glow + cloud shadow in ONE shader pass
const q=new URLSearchParams(location.search),mode=q.get('mode')||'2d',dpr=+(q.get('dpr')||2),ROOT=q.get('root')||'/';
const cv=document.getElementById('c'),W=cv.width=Math.round(innerWidth*dpr),H=cv.height=Math.round(innerHeight*dpr);
const S=3.74*dpr/2,TILE=400;                         // device px per world unit (the real idle view), world units per 1024 px tile
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const load=u=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u;});
const rnd=(s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296)(20261113);
// art: 5x3 real ground tiles (so the camera can pan), generated glow / cloud / shadow / light / sprite textures
const COLS=5,ROWS=3,tiles=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)tiles.push(load(`${ROOT}img/map-zone1/v7r/r${r+2}-c${c+3}.webp`).then(im=>({im,r,c})));
const T=await Promise.all(tiles);
const blob=(w,h,rgb,n)=>{const c=mk(w,h),g=c.getContext('2d');for(let i=0;i<n;i++){const x=rnd()*w,y=rnd()*h,r=(.08+rnd()*.2)*w,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${rgb},.9)`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(0,0,w,h);}return c;};
for(const t of T)t.glow=blob(256,256,'255,120,30',5);          // 1/4-res glow layer per tile, like town-lighting.js
const cloud=blob(1024,512,'14,8,26',14),shadow=blob(192,192,'14,8,26',3),light=blob(128,128,'255,200,110',1),liquid=blob(512,512,'60,160,255',9);
const sprite=(()=>{const c=mk(256,256),g=c.getContext('2d');g.fillStyle='#d8c090';g.beginPath();g.ellipse(128,150,60,100,0,0,7);g.fill();g.fillStyle='#402018';g.beginPath();g.arc(128,60,44,0,7);g.fill();return c;})();
const items=n=>Array.from({length:n},()=>({x:rnd()*COLS*TILE,y:rnd()*ROWS*TILE,k:rnd()}));
const shadows=items(64*2),lights=items(49*2),sprites=items(110*2);   // x2: the camera sees about half of the 5x3 tile world
const cam=t=>({x:TILE*1.2+Math.cos(t/2600)*TILE*1.1+W/S/2,y:TILE*1.0+Math.sin(t/2100)*TILE*.6+H/S/2});
const view=t=>{const c=cam(t);return {x:c.x-W/S/2,y:c.y-H/S/2,w:W/S,h:H/S};};
let draw;
if(mode==='2d'){
  const g=cv.getContext('2d');
  // like terrain-detail.js: each tile resampled once to device size, then blitted 1:1
  const px=Math.round(TILE*S);for(const t of T){t.dev=mk(px,px);const c=t.dev.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(t.im,0,0,px,px);}
  draw=time=>{const v=view(time);g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);g.setTransform(S,0,0,S,-v.x*S,-v.y*S);g.imageSmoothingQuality='low';
    const vis=T.filter(t=>t.c*TILE<v.x+v.w&&(t.c+1)*TILE>v.x&&t.r*TILE<v.y+v.h&&(t.r+1)*TILE>v.y);
    for(const t of vis)g.drawImage(t.dev,t.c*TILE,t.r*TILE,TILE+1/S,TILE+1/S);
    g.globalCompositeOperation='screen';g.globalAlpha=.13+.035*Math.sin(time/510);for(const t of vis)g.drawImage(t.glow,t.c*TILE,t.r*TILE,TILE,TILE);
    g.globalCompositeOperation='source-over';g.globalAlpha=1;
    for(const s of shadows)g.drawImage(shadow,s.x-90,s.y-45,180,90);
    g.globalAlpha=.9;g.drawImage(liquid,v.x+v.w*.1,v.y+v.h*.3,v.w*.75,v.h*.73);g.globalAlpha=1;       // liquid layer composite
    g.globalCompositeOperation='lighter';for(const s of lights)g.drawImage(light,s.x-70,s.y-70,140,140);g.globalCompositeOperation='source-over';
    for(const s of sprites)g.drawImage(sprite,s.x-45,s.y-90,90,90);
    g.globalAlpha=.34;g.drawImage(cloud,v.x-((time/50)%400),v.y,v.w+400,v.h);g.globalAlpha=1;           // cloud-shadow layer, last
  };
}else{
  const top=document.getElementById('top'),tg=mode==='hybrid'?(top.style.display='block',top.width=W,top.height=H,top.getContext('2d')):null;
  const top2d=(time,v,cr)=>{tg.setTransform(1,0,0,1,0,0);tg.clearRect(0,0,W,H);tg.setTransform(S,0,0,S,-v.x*S,-v.y*S);tg.imageSmoothingQuality='low';
    for(const s of sprites)tg.drawImage(sprite,s.x-45,s.y-90,90,90);tg.globalAlpha=.34;tg.drawImage(cloud,cr[0],cr[1],cr[2],cr[3]);tg.globalAlpha=1;};
  const gl=cv.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,premultipliedAlpha:true});
  if(!gl)throw new Error('no webgl2');
  const prog=(vs,fs)=>{const p=gl.createProgram();for(const [t,s] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh);}gl.linkProgram(p);return p;};
  const VS=`#version 300 es
  in vec4 aRect; in float aAlpha; uniform vec4 uView; out vec2 vUv; out float vA; out vec2 vWorld;
  void main(){ vec2 c=vec2(gl_VertexID&1,(gl_VertexID>>1)&1); vec2 w=aRect.xy+c*aRect.zw; vUv=c; vA=aAlpha; vWorld=w;
    vec2 n=(w-uView.xy)/uView.zw; gl_Position=vec4(n.x*2.-1.,1.-n.y*2.,0.,1.); }`;
  const FS=`#version 300 es
  precision mediump float; in vec2 vUv; in float vA; uniform sampler2D uTex; out vec4 o; void main(){ o=texture(uTex,vUv)*vA; }`;
  const FSG=`#version 300 es
  precision highp float; in vec2 vUv; in vec2 vWorld; uniform sampler2D uTex,uGlow,uCloud; uniform float uGlowA,uCloudA; uniform vec4 uCloudRect; out vec4 o;
  void main(){ vec3 g=texture(uTex,vUv).rgb; vec4 gw=texture(uGlow,vUv)*uGlowA; g=g+gw.rgb-g*gw.rgb;                 // 'screen'
    vec4 cl=texture(uCloud,(vWorld-uCloudRect.xy)/uCloudRect.zw)*uCloudA; g=g*(1.-cl.a)+cl.rgb; o=vec4(g,1.); }`;
  const P=prog(VS,FS),PG=prog(VS,FSG);
  const tex=(src,mip=true)=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    if(mip){gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);}else gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);return t;};
  for(const t of T){t.tex=tex(t.im);t.gtex=tex(t.glow,false);}
  const tx={cloud:tex(cloud),shadow:tex(shadow),light:tex(light),sprite:tex(sprite),liquid:tex(liquid)};
  // one instanced quad batch (rect x,y,w,h + alpha), re-filled per group
  const buf=gl.createBuffer(),data=new Float32Array(5*1024),vao=gl.createVertexArray();gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,data.byteLength,gl.DYNAMIC_DRAW);
  for(const p of [P,PG]){const a=gl.getAttribLocation(p,'aRect'),b=gl.getAttribLocation(p,'aAlpha');gl.bindAttribLocation(p,0,'aRect');gl.bindAttribLocation(p,1,'aAlpha');}
  gl.linkProgram(P);gl.linkProgram(PG);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,4,gl.FLOAT,false,20,0);gl.vertexAttribDivisor(0,1);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,16);gl.vertexAttribDivisor(1,1);
  const U=(p,n)=>gl.getUniformLocation(p,n);
  const batch=(texture,list)=>{let n=0;for(const [x,y,w,h,a] of list){data.set([x,y,w,h,a],n*5);n++;}gl.bindTexture(gl.TEXTURE_2D,texture);gl.bufferSubData(gl.ARRAY_BUFFER,0,data,0,n*5);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,n);};
  const NORMAL=()=>gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA),SCREEN=()=>gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_COLOR),ADD=()=>gl.blendFunc(gl.ONE,gl.ONE);
  gl.viewport(0,0,W,H);
  draw=time=>{const v=view(time);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
    const vis=T.filter(t=>t.c*TILE<v.x+v.w&&(t.c+1)*TILE>v.x&&t.r*TILE<v.y+v.h&&(t.r+1)*TILE>v.y);
    const glowA=.13+.035*Math.sin(time/510),cloudRect=[v.x-((time/50)%400),v.y,v.w+400,v.h];
    if(mode==='gl-merged'||mode==='hybrid'){
      gl.disable(gl.BLEND);gl.useProgram(PG);gl.uniform4f(U(PG,'uView'),v.x,v.y,v.w,v.h);gl.uniform1i(U(PG,'uTex'),0);gl.uniform1i(U(PG,'uGlow'),1);gl.uniform1i(U(PG,'uCloud'),2);
      gl.uniform1f(U(PG,'uGlowA'),glowA);gl.uniform1f(U(PG,'uCloudA'),mode==='hybrid'?0.:.34);gl.uniform4f(U(PG,'uCloudRect'),...cloudRect);
      gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,tx.cloud);
      for(const t of vis){gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,t.gtex);gl.activeTexture(gl.TEXTURE0);batch(t.tex,[[t.c*TILE,t.r*TILE,TILE,TILE,1]]);}
      gl.enable(gl.BLEND);gl.useProgram(P);gl.uniform4f(U(P,'uView'),v.x,v.y,v.w,v.h);
    }else{
      gl.useProgram(P);gl.uniform4f(U(P,'uView'),v.x,v.y,v.w,v.h);gl.activeTexture(gl.TEXTURE0);
      gl.disable(gl.BLEND);for(const t of vis)batch(t.tex,[[t.c*TILE,t.r*TILE,TILE,TILE,1]]);
      gl.enable(gl.BLEND);SCREEN();for(const t of vis)batch(t.gtex,[[t.c*TILE,t.r*TILE,TILE,TILE,glowA]]);
    }
    NORMAL();batch(tx.shadow,shadows.map(s=>[s.x-90,s.y-45,180,90,1]));
    batch(tx.liquid,[[v.x+v.w*.1,v.y+v.h*.3,v.w*.75,v.h*.73,.9]]);
    ADD();batch(tx.light,lights.map(s=>[s.x-70,s.y-70,140,140,1]));
    if(mode==='hybrid'){top2d(time,v,cloudRect);return;}
    NORMAL();batch(tx.sprite,sprites.map(s=>[s.x-45,s.y-90,90,90,1]));
    if(mode!=='gl-merged')batch(tx.cloud,[[...cloudRect,.34]]);
    // (gl-merged: the cloud shadow is already in the ground pass; sprites are not darkened by it in this prototype - the real renderer would tint them per sprite in the vertex stage)
  };
}
// measure: frame intervals after a warm-up
const F=window.__bench={mode,dpr,size:[W,H],frames:[],ready:false};let last=0,t0=performance.now();
function tick(t){draw(t);if(last&&t-t0>2500)F.frames.push(t-last);last=t;requestAnimationFrame(tick);}
requestAnimationFrame(tick);F.ready=true;
F.summary=()=>{const f=F.frames.slice().sort((a,b)=>a-b),n=f.length,sum=f.reduce((a,b)=>a+b,0);return {mode,dpr,size:[W,H],frames:n,fps:+(1000*n/sum).toFixed(1),ms_avg:+(sum/n).toFixed(2),ms_p95:+f[Math.floor(n*.95)].toFixed(2)};};
F.reset=()=>{F.frames=[];};
</script>
