<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A3 ตรวจท่าเดินคนงานทั้ง 4 โซน</title><style>
body{margin:0;background:#170f13;color:#f0e4d6;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:23px;margin:0 0 8px}p{margin:6px 0;color:#c6b5a4}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{padding:9px 18px;background:#50323b;border:1px solid #c19b58;border-radius:8px;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#c19b58;color:#170f13}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #786044;border-radius:12px;padding:10px;background:#23191d}h2{font-size:17px;margin:0 0 4px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{text-align:center;font-size:14px}.after .label{color:#a9dcad}canvas{width:100%;display:block;background:#4b443d;border-radius:8px}output{display:block;text-align:center;font-size:12px;color:#bda997}#status{font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style><main><h1>ตรวจท่าเดินคนงาน · ทั้ง 4 โซน</h1><p>ตัววาดและสไปรต์จริงของเกม · เปรียบเทียบขณะรับส่งวิญญาณ</p><nav aria-label="ทิศทาง"><button data-mode="right" aria-pressed="true">เดินขวา</button><button data-mode="left" aria-pressed="false">เดินซ้าย</button><button data-mode="down" aria-pressed="false">เดินลง</button><button data-mode="up" aria-pressed="false">เดินขึ้น</button><button data-mode="stop" aria-pressed="false">หยุดยืน</button></nav><div class="grid"></div><p id="status"></p></main><script type="module">
import * as before from '/src/workers-before.js';import * as after from '/src/workers.js?v=a3';
const zones=['th','asia','west','cyberhell'],names=['โซน 1 · ไทย','โซน 2 · เอเชีย','โซน 3 · ตะวันตก','โซน 4 · ไซเบอร์'];let mode='right',started=performance.now(),lastCycle=-1;const entries=[],history=[],errors=[];addEventListener('error',e=>errors.push(e.message));
const grid=document.querySelector('.grid');zones.forEach((zone,i)=>{const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${names[i]}</h2><div class="pair">${['before','after'].map(s=>`<div class="${s}"><div class="label">${s==='before'?'ก่อนแก้ · ยื่นแขน':'แก้แล้ว · เดินปกติ'}</div><canvas width="500" height="270" aria-label="${names[i]} ${s}"></canvas><output></output></div>`).join('')}</div>`;grid.append(card);for(const side of ['before','after']){const w={id:'worker:1',homeZone:zone,x:50,y:180,face:1,job:{kind:'escort',soulId:7},moving:false,cargo:null},g={zone,workerState:{workers:[w]}};entries.push({side,zone,w,g,api:side==='before'?before:after,canvas:card.querySelector('.'+side+' canvas'),out:card.querySelector('.'+side+' output')});}});
const paths={right:[[80,210],[420,210]],left:[[420,210],[80,210]],down:[[250,175],[250,235]],up:[[250,235],[250,175]],stop:[[250,210],[250,210]]};
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>{mode=button.dataset.mode;started=performance.now();lastCycle=-1;for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b===button));};
function tick(now){const cycle=Math.floor((now-started)/5000),path=paths[mode],elapsed=(now-started)%5000;for(const e of entries){if(cycle!==lastCycle){[e.w.x,e.w.y]=path[0];}const walk={path,duration:5000,delay:0,elapsed,escort:{workerId:e.w.id}};e.api.advanceWorkerEscort(e.g,walk);const ctx=e.canvas.getContext('2d');ctx.clearRect(0,0,500,270);ctx.strokeStyle='#6a6257';ctx.lineWidth=1;for(let x=0;x<500;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,270);ctx.stroke();}for(let y=0;y<270;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(500,y);ctx.stroke();}e.api.drawWorker(ctx,e.w,now,155);e.out.textContent=`${e.w.moving?'กำลังเดิน':'ยืนพัก'} · ${e.w.heading||'side'} · row ${e.api.workerRow(e.w,true)}`;e.out.dataset.row=e.api.workerRow(e.w,true);e.out.dataset.mode=mode;}
 lastCycle=cycle;document.querySelector('#status').textContent='ภาพตรวจเฟรมบนพื้นทดสอบ · ไม่เปลี่ยนเส้นทางหรือข้อมูลเซฟในเกม';requestAnimationFrame(tick);}
requestAnimationFrame(tick);setInterval(()=>{const sample={mode,at:Math.round(performance.now()),rows:entries.map(e=>({zone:e.zone,side:e.side,row:e.api.workerRow(e.w,true),moving:e.w.moving,heading:e.w.heading}))};history.push(sample);if(history.length>600)history.shift();fetch('/__qa-results',{method:'POST',body:JSON.stringify({history,errors})});},500);
</script>
